<!DOCTYPE html>
<html style="height: 100%; margin: 0;">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg, #FFFFFF);
            color: var(--fg, #1A1A1A);
        }
        #reader-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
        }
        foliate-view {
            display: block;
            width: 100%;
            height: 100%;
        }
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: -apple-system, sans-serif;
            font-size: 16px;
            color: #888;
        }
        #error {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            max-width: 400px;
            padding: 2em;
            color: #c00;
            font-family: -apple-system, sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="reader-container">
        <div id="loading">Loading book...</div>
        <div id="error"></div>
    </div>
    <script type="module" src="reader.js"></script>
</body>
</html>
