<!DOCTYPE html>
<html style="height: 100%; margin: 0;">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg, #FFFFFF);
            color: var(--fg, #1A1A1A);
        }
        #reader-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
        }
        foliate-view {
            display: block;
            width: 100%;
            height: 100%;
        }
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: -apple-system, sans-serif;
            font-size: 16px;
            color: #888;
        }
        #error {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            max-width: 400px;
            padding: 2em;
            color: #c00;
            font-family: -apple-system, sans-serif;
            text-align: center;
        }

        /* --- Progress bar --- */
        #leo-progress-bar-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            pointer-events: none;
        }
        #leo-progress-label {
            display: none;
            position: absolute;
            bottom: 6px;
            right: 10px;
            font-family: -apple-system, "PingFang SC", sans-serif;
            font-size: 11px;
            font-weight: 500;
            color: rgba(120, 120, 130, 0.85);
            letter-spacing: 0.01em;
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
        }
        #leo-progress-track {
            width: 100%;
            height: 3px;
            background: rgba(0, 0, 0, 0.06);
        }
        #leo-progress-fill {
            height: 3px;
            width: 0%;
            background: var(--leo-accent, #007AFF);
            transition: width 0.3s ease;
        }

        /* Hide any built-in foliate-js progress UI to avoid overlap with Leo's own bar */
        foliate-view::part(progress) { display: none !important; }
        #progress-slider { display: none !important; }
    </style>
</head>
<body>
    <div id="reader-container">
        <div id="loading">Loading book...</div>
        <div id="error"></div>
    </div>

    <!-- Progress bar — sits above the reader container -->
    <div id="leo-progress-bar-container">
        <span id="leo-progress-label"></span>
        <div id="leo-progress-track">
            <div id="leo-progress-fill"></div>
        </div>
    </div>

    <script type="module" src="reader.js"></script>
</body>
</html>
